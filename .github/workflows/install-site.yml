name: Install website package

on:
  push:
    paths:
      - 'site-package.zip'
      - '.github/workflows/install-site.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack website
        run: |
          unzip -o site-package.zip -d .
          rm -f site-package.zip
          rm -rf __MACOSX
      - name: Commit installed website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install complete multipage website"
            git push
          fi
